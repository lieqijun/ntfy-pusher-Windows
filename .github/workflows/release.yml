name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute date-time tag and version
        id: vars
        shell: pwsh
        run: |
          $dt = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), 'China Standard Time')
          $tag = $dt.ToString("yyyyMMdd-HHmmss")
          # AssemblyVersion 每个分量上限为 65534(16 位)。若把 HHmmss(最大 235959) 作为第 4 段，
          # 在 06:33 之后(>65535)会触发 CS7034 编译失败。故版本仅用 yyyy.MM.dd(3 段)，
          # 完整的日期时间戳保留在上面的 tag 中。
          $version = $dt.ToString("yyyy.MM.dd")
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (win-x64, framework-dependent)
        shell: pwsh
        run: |
          dotnet publish ntfysh_client/ntfysh_client.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.vars.outputs.version }} -p:DebugType=none -p:DebugSymbols=false -o publish/win-x64

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path "publish/win-x64/*" -DestinationPath "ntfy-pusher-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: ntfy-pusher-windows-x64.zip
          generate_release_notes: true
