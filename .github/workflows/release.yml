name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compute date-time tag and version
        id: vars
        shell: pwsh
        run: |
          $dt = Get-Date
          $tag = $dt.ToString("yyyyMMdd-HHmmss")
          $version = $dt.ToString("yyyy.MM.dd.HHmmss")
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (win-x64, framework-dependent)
        shell: pwsh
        run: |
          dotnet publish ntfysh_client/ntfysh_client.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ steps.vars.outputs.version }} -p:DebugType=none -p:DebugSymbols=false -o publish/win-x64

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path "publish/win-x64/*" -DestinationPath "ntfy-pusher-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: ntfy-pusher-windows-x64.zip
          generate_release_notes: true
